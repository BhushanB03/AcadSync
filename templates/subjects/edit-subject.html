{% extends "base.html" %}

{% block title %}Edit Subject — AcadSync{% endblock %}

{% block extra_css %}
<style>
    .form-container {
        max-width: 620px;
        margin: 2rem auto;
        background: var(--bg-surface-card);
        border: 1px solid var(--border-color);
        padding: 2rem;
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
    }
    .form-container h1 {
        color: var(--text-primary);
        font-size: 1.85rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
        text-align: center;
    }
    .form-group {
        margin-bottom: 1.5rem;
    }
    .form-group label {
        display: block;
        margin-bottom: 0.4rem;
        font-weight: 600;
        font-size: 0.88rem;
        color: var(--text-primary);
    }
    .form-group input,
    .form-group select {
        width: 100%;
        padding: 0.75rem 0.9rem;
        background: var(--bg-input);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        color: var(--text-primary);
        font-size: 0.95rem;
        transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        font-family: inherit;
    }
    .form-group input:focus,
    .form-group select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-subtle);
    }
    /* Custom University Toggle Switch */
    .toggle-group {
        margin-bottom: 1.5rem;
    }
    .toggle-label {
        display: block;
        margin-bottom: 0.6rem;
        font-weight: 600;
        font-size: 0.88rem;
        color: var(--text-primary);
    }
    .toggle-container {
        display: flex;
        align-items: center;
        gap: 1rem;
    }
    .university-label {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-muted);
    }
    .toggle-switch {
        position: relative;
        display: inline-block;
        width: 76px;
        height: 38px;
    }
    .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }
    .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: var(--badge-vit);
        transition: var(--transition-fast);
        border-radius: 40px;
    }
    .slider:before {
        position: absolute;
        content: "";
        height: 30px;
        width: 30px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        transition: var(--transition-fast);
        border-radius: 50%;
    }
    input:checked + .slider {
        background-color: var(--badge-iitm);
    }
    input:checked + .slider:before {
        transform: translateX(38px);
    }
    .toggle-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--text-dim);
        margin-top: 0.4rem;
        padding: 0 2px;
    }
    .toggle-labels span.left {
        color: var(--badge-vit);
    }
    .toggle-labels span.right {
        color: var(--badge-iitm);
    }
    .btn {
        padding: 0.75rem 1.25rem;
        border-radius: var(--radius-sm);
        font-size: 0.92rem;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--transition-fast);
        text-decoration: none;
        text-align: center;
        border: 1px solid transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }
    .form-actions-main .btn {
        flex: 1;
    }
    .btn-primary {
        background-color: var(--accent);
        border-color: var(--accent);
        color: white;
    }
    .btn-primary:hover {
        background-color: var(--accent-hover);
        border-color: var(--accent-hover);
        transform: translateY(-1px);
    }
    .btn-secondary {
        background-color: var(--bg-surface-hover);
        border-color: var(--border-color);
        color: var(--text-primary);
    }
    .btn-secondary:hover {
        background-color: var(--bg-surface-active);
        border-color: var(--border-color-hover);
    }
    .btn-archive {
        background-color: var(--btn-edit-bg);
        color: var(--btn-edit-text);
        border-color: var(--btn-edit-border);
    }
    .btn-archive:hover {
        background-color: var(--accent-purple);
        color: white;
    }
    .form-actions-wrapper {
        display: flex;
        gap: 1rem;
        margin-top: 2rem;
        flex-wrap: wrap;
    }
    .form-actions-main {
        display: flex;
        gap: 1rem;
        flex: 1;
        min-width: 250px;
    }
    .form-actions-archive {
        display: flex;
        align-items: center;
    }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Edit Subject</h1>

    <form method="POST" action="{{ url_for('subjects.edit', subject_id=subject.id) }}">
        <!-- CSRF Token -->
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- Subject Name -->
        <div class="form-group">
            <label for="name">Subject Name *</label>
            <input type="text" id="name" name="name" value="{{ subject.name }}" placeholder="e.g., Data Structures" required>
        </div>

        <!-- Subject Code -->
        <div class="form-group">
            <label for="code">Subject Code *</label>
            <input type="text" id="code" name="code" value="{{ subject.code }}" placeholder="e.g., CS201" required>
        </div>

        <!-- Term -->
        <div class="form-group">
            <label for="term">Term *</label>
            <input type="text" id="term" name="term" value="{{ subject.term }}" placeholder="e.g., January 2027" required>
        </div>

        <!-- Subject Type -->
        <div class="form-group">
            <label for="subject_type">Subject Type *</label>
            <select id="subject_type" name="subject_type" required>
                <option value="">-- Select Type --</option>
                <option value="Theory" {% if subject.subject_type == 'Theory' %}selected{% endif %}>Theory</option>
                <option value="Lab" {% if subject.subject_type == 'Lab' %}selected{% endif %}>Lab</option>
                <option value="Seminar" {% if subject.subject_type == 'Seminar' %}selected{% endif %}>Seminar</option>
                <option value="Project" {% if subject.subject_type == 'Project' %}selected{% endif %}>Project</option>
            </select>
        </div>

        <!-- University Toggle Switch -->
        <div class="toggle-group">
            <label class="toggle-label">University</label>
            <div class="toggle-container">
                <span class="university-label">IITM</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="university" name="university" value="on" {% if subject.university == 'VIT' %}checked{% endif %}>
                    <span class="slider"></span>
                    <div class="toggle-labels">
                        <span class="left">IITM</span>
                        <span class="right">VIT</span>
                    </div>
                </label>
                <span class="university-label">VIT</span>
            </div>
        </div>

        <!-- Form Actions -->
        <div class="form-actions-wrapper">
            <div class="form-actions-main">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('subjects.detail', subject_id=subject.id) }}" class="btn btn-secondary">Cancel</a>
            </div>
            <div class="form-actions-archive">
                <form method="POST" action="{{ url_for('subjects.archive', subject_id=subject.id) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="btn btn-archive" onclick="return confirm('Archive this subject?');">Archive Subject</button>
                </form>
            </div>
        </div>
    </form>
</div>
{% endblock %}
