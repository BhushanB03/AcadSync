{% extends "base.html" %}

{% block title %}Add Note - {{ subject.name }}{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <div>
            <h1>Add Note</h1>
            <p class="subject-info">{{ subject.name }} ({{ subject.code }}) - {{ category_label }}</p>
        </div>
        <a href="{{ url_for('materials.category_list', subject_id=subject.id, category=category) }}" class="btn btn-secondary">Back</a>
    </div>

    <div class="form-card">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div class="form-group">
                <label for="note_content">Note Content</label>
                <textarea id="note_content" name="note_content" rows="8" required></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Note</button>
            </div>
        </form>
    </div>
</div>

<style>
    .form-card {
        max-width: 700px;
        margin: 2rem auto 0;
        background: var(--bg-surface-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        padding: 1.75rem;
        box-shadow: var(--shadow-sm);
    }

    .form-group {
        margin-bottom: 1.25rem;
    }

    .form-group label {
        display: block;
        margin-bottom: 0.4rem;
        font-weight: 600;
        color: var(--text-primary);
        font-size: 0.88rem;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 0.75rem 0.9rem;
        background: var(--bg-input);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        color: var(--text-primary);
        font-size: 0.92rem;
        font-family: inherit;
        transition: border-color var(--transition-fast);
    }

    .form-group input:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-subtle);
    }

    textarea {
        resize: vertical;
    }
</style>
{% endblock %}
